[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# Versões exatas (=), publicadas há pelo menos 14 dias: `just idade-crates` verifica o Cargo.lock.
hub-core = { path = "crates/hub-core" }
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["ws"] }
portable-pty = "=0.9.0"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util", "sync"] }
tower = { version = "=0.5.3", features = ["util"] }
toml = "=1.1.6"
tower-http = { version = "=0.6.11", features = ["cors", "fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
chrono = "0.4.45"
tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin-clipboard-manager = "=2.4.1"
tauri-plugin-http = "=2.8.0"
tauri-plugin-websocket = "=2.5.0"
# Ancoragem GTK do painel da memória (F5.5): o wry no Linux ignora os bounds do add_child
# (as duas webviews dividem a GtkBox), então reposicionamos os widgets GTK via with_webview.
# Mesma versão que o tauri puxa (Cargo.lock).
gtk = "=0.18.2"
# Só nos testes do hubd (cliente WebSocket); mesma versão que o axum usa.
tokio-tungstenite = "=0.29.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"