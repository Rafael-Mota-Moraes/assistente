# Configuração do Assistente. Copie para ~/.config/assistente/assistente.toml
# (o instalar.sh faz isso) e ajuste. A pasta ~/.config/assistente é montada (somente leitura)
# dentro da VM no mesmo caminho, então hubd e app leem o MESMO arquivo.
# Chaves em inglês (são lidas pelo código); comentários em pt-BR. Spec: docs/specs/04-perfis-e-projetos.md

[hub]
# Onde o hubd escuta DENTRO da VM. A VM só é alcançável pelo host (rede NAT do Incus).
listen = "0.0.0.0:7878"
# Token exigido em toda rota exceto /api/health. Gerado por `bin/assistente token`.
token_file = "~/.config/assistente/hub.token"

[vm]
name = "assistente"
image = "images:ubuntu/24.04/cloud"
cpus = 6
memory = "12GiB"
disk = "60GiB"
# Rede própria do Incus (assistente0, 10.77.0.1/24) com IP fixo para a VM: o app sabe onde
# achar o hubd sem descobrir nada. Spec: docs/specs/01-vm-e-instalacao.md
ip = "10.77.0.10"

[notebook]
# Alias do ~/.ssh/config da VM; `bin/assistente notebook instalar` escreve esse alias a partir
# de address/user. address pode ser o IP da LAN ou o nome no Tailscale.
ssh_host = "notebook"
address = "192.168.0.50"
user = "seu-usuario"
# Pasta de trabalho no notebook: clones dos projetos, logs do modo dormir, briefings.
workdir = "~/assistente"

[notebook.tunnel]
# Portas do notebook encaminhadas para 127.0.0.1 da VM pelo túnel SSH do hubd (só 9router).
"9router" = 20128

[memory]
# Wiki git no host (virtiofs rw na VM). Backup e fonte da verdade do Markdown (spec 06).
mirror_dir = "~/.local/share/assistente/memoria-copia"
# SQLite e modelos: disco local da VM — não coloque no espelho virtiofs.
data_dir = "~/.local/share/assistente/ai-memory"
mirror_every_minutes = 60
port = 49374

# Um bloco por perfil. A chave (pessoal, trabalho) é o id usado na API e nos caminhos.
[profiles.pessoal]
label = "Pessoal"
color = "#8b5cf6"
root = "~/Documentos/pessoal/projetos"
git_name = "Seu Nome"
git_email = "voce@exemplo.com"
# ssh_key = "~/.assistente/perfis/pessoal/ssh/id_ed25519"
memory_workspace = "pessoal"
opencode_model = "9router/free"
# Provedores do opencode do PC (um plano pago, por exemplo) entram na VM com
# `assistente agentes configurar`. Para um perfil enxergar um: liste-o em
# opencode_providers (a chave vai para o opencode.json do perfil, não para o config global
# da VM), troque o opencode_model acima por "<provedor>/<modelo>" e libere o host da API,
# que o jail bloqueia por padrão:
# opencode_providers = ["9router", "meu-provedor"]     # padrão: ["9router"]
# opencode_small_model = "meu-provedor/modelo-pequeno"   # títulos e resumos
# opencode_allow_hosts = ["api.meu-provedor.com"]
# Modelos do próprio OpenCode (Go/Zen)? Inclua também opencode.ai e models.opencode.ai.
# As policies do opencode.json do PC (bloqueio de providers no tab de modelos) também são
# espelhadas nos perfis: se o provedor novo estiver bloqueado no PC, libere-o lá primeiro.
# false = Claude Code usa a assinatura direto na Anthropic; true = passa pelo 9router.
claude_via_9router = false

[profiles.trabalho]
label = "Trabalho"
color = "#0ea5e9"
root = "~/Documentos/trabalho"
git_name = "Seu Nome"
git_email = "voce@empresa.com"
# ssh_key = "~/.assistente/perfis/trabalho/ssh/id_ed25519"
memory_workspace = "trabalho"
opencode_model = "9router/free"
claude_via_9router = false
