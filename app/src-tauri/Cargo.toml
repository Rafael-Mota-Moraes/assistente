[package]
name = "assistente-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
gtk.workspace = true
hub-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# F9.10: o app pergunta ao hubd o que foi aprovado (e devolve o resultado do PC). Mesmo
# cliente HTTP do hubd, para não trazer outro.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio.workspace = true
# unstable: janelas com várias webviews (o painel da memória é uma webview filha da principal)
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-http.workspace = true
tauri-plugin-websocket.workspace = true
chrono.workspace = true
