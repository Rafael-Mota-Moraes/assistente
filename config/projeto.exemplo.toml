# Configuração opcional por projeto. Salve como .assistente.toml na raiz do repositório.
# Specs: docs/specs/05-sandbox.md ([jail]), docs/specs/08-modo-dormir.md ([sleep]).

[jail]
# Projetos com `./dev` (Docker no host) precisam disto para o agente rodar `just check` na sessão.
docker = false

[sleep]
# De onde o modo dormir tira as tarefas: "backlog" (abaixo) ou "quadro" (cards `agente` do
# .assistente/kanban.json, uma por iteração; docs/specs/10-kanban-e-trabalhadores.md).
source = "backlog"
# Lista de tarefas no formato de docs/FUNCIONALIDADES.md: itens "- [ ]" com ID, "Pronto quando"
# e "Como testar". O agente pega o primeiro item [ ] da seção (ou do arquivo, se vazio).
backlog = "docs/FUNCIONALIDADES.md"
section = ""
# Comando que precisa passar antes de marcar um item como [x].
check = "./dev just check"
# Itens que só um humano pode fechar (o agente nunca escolhe). Basta um trecho do título.
human_only = ["playtest", "validação humana"]
# Limites de cada iteração do loop no notebook.
max_minutes = 240
attempts = 3
# Modelo do opencode no notebook (vazio = o padrão do opencode.json de lá).
model = ""
# Regras extras do projeto que entram no prompt (além de ler CLAUDE.md/AGENTS.md).
extra_instructions = """
"""

[workers]
# Trabalhadores do quadro (F11.6). Modelos do opencode, principal primeiro; os outros são reserva
# quando o anterior falha. Nomes saem de `opencode models` (confira na VM).
models = []
# Tentativas por modelo antes de passar para o próximo.
attempts = 3
# Minutos máximos por tentativa.
max_minutes = 60
# Segundos de espera entre tentativas.
wait_secs = 60
